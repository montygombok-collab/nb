<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Crew لإدارة المهام</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --success: #16a34a;
        }

        body.dark {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --text-color: #f8fafc;
            --border-color: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .wrap {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        input, textarea {
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0 12px 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-main { background: var(--primary); color: #fff; width: 100%; }
        .btn-main:hover { background: var(--primary-hover); }

        .btn-sec { background: var(--success); color: #fff; padding: 6px 12px; font-size: 12px; }
        .btn-del { background: var(--danger); color: #fff; padding: 6px 12px; font-size: 12px; }
        .btn-ghost { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }

        .row { display: flex; gap: 8px; }
        .row input { margin: 0; }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .hidden { display: none !important; }
        .hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0;">Crew</h2>
        <div>
            <button id="themeBtn" class="btn-ghost" style="padding: 6px 10px; font-size: 12px;">🌙 المظهر</button>
            <span id="userEmail" style="font-size: 13px; margin: 0 10px;"></span>
            <button id="logoutBtn" class="btn-del hidden" style="padding: 6px 10px;">خروج</button>
        </div>
    </header>

    <div class="wrap">
        
        <!-- قسم الدخول -->
        <div id="authBox" class="box">
            <h3>تسجيل الدخول / إنشاء حساب</h3>
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button id="authBtn" class="btn-main">دخول</button>
        </div>

        <!-- التطبيق الرئيسي -->
        <div id="appBox" class="box hidden">
            <button id="openCreateBtn" class="btn-main">➕ إنشاء مجموعة جديدة</button>
            
            <hr class="hr">
            <h3>مجموعاتك المشارك بها</h3>
            <div id="myGroupsList">جاري التحميل...</div>

            <hr class="hr">
            <h3>المجموعات العامة المتاحة</h3>
            <div id="allGroupsList">جاري التحميل...</div>
        </div>

        <!-- شاشة تفاصيل المجموعة المحددة -->
        <div id="groupViewBox" class="box hidden">
            <button id="backBtn" class="btn-ghost" style="margin-bottom: 10px;">⬅ العودة للقائمة</button>
            <h2 id="groupTitle" style="margin-top: 0;"></h2>

            <div id="adminPanel" class="hidden" style="background: var(--bg-color); padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                <h4 style="margin: 0 0 8px 0;">طلبات الانضمام المعلقة:</h4>
                <div id="requestsList">لا توجد طلبات</div>
            </div>

            <h4>ملاحظات المجموعة</h4>
            <textarea id="groupNotes" placeholder="اكتب ملاحظات المجموعة هنا..."></textarea>

            <hr class="hr">
            <h4>إدارة المهام</h4>
            <div class="row">
                <input type="text" id="taskTitle" placeholder="اسم المهمة">
                <input type="text" id="taskAssignee" placeholder="المسؤول عنها">
                <button id="addTaskBtn" class="btn-main" style="width: auto;">إضافة</button>
            </div>
            <div id="tasksList" style="margin-top: 10px;"></div>
        </div>

    </div>

    <!-- نافذة إنشاء مجموعة -->
    <div id="createModal" class="box hidden" style="position: fixed; top: 20%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 99; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h3>إنشاء مجموعة جديدة</h3>
        <input type="text" id="newGroupName" placeholder="اسم المجموعة">
        <div class="row">
            <button id="confirmCreateBtn" class="btn-main">إنشاء</button>
            <button id="cancelCreateBtn" class="btn-ghost">إلغاء</button>
        </div>
    </div>

    <!-- كود فايربيس والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, getDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMM9yXT-LJfWPTv0AD2iD2rC2rnenYYik",
            authDomain: "crew-397b4.firebaseapp.com",
            projectId: "crew-397b4",
            storageBucket: "crew-397b4.firebasestorage.app",
            messagingSenderId: "402724763653",
            appId: "1:402724763653:web:bbe671c78ad9b77b2c846c",
            measurementId: "G-DHSN624VNK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let currentGroupId = null;
        let currentGroupData = null;

        // مراقبة حالة تسجيل الدخول
        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('appBox').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('userEmail').innerText = user.email;
                fetchGroups();
            } else {
                document.getElementById('authBox').classList.remove('hidden');
                document.getElementById('appBox').classList.add('hidden');
                document.getElementById('groupViewBox').classList.add('hidden');
                document.getElementById('logoutBtn').classList.add('hidden');
                document.getElementById('userEmail').innerText = '';
            }
        });

        // تسجيل الدخول أو إنشاء حساب تلقائياً
        document.getElementById('authBtn').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!email || !password) return alert('الرجاء إدخال البريد وكلمة المرور');
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch {
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    alert('خطأ: ' + err.message);
                }
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // فتح وإغلاق نافذة الإنشاء
        document.getElementById('openCreateBtn').addEventListener('click', () => document.getElementById('createModal').classList.remove('hidden'));
        document.getElementById('cancelCreateBtn').addEventListener('click', () => document.getElementById('createModal').classList.add('hidden'));

        // تأكيد إنشاء المجموعة
        document.getElementById('confirmCreateBtn').addEventListener('click', async () => {
            const name = document.getElementById('newGroupName').value.trim();
            if (!name) return alert('أدخل اسم المجموعة');
            try {
                await addDoc(collection(db, "groups"), {
                    name: name,
                    owner: user.uid,
                    members: [user.uid],
                    requests: [],
                    notes: "",
                    tasks: []
                });
                document.getElementById('newGroupName').value = '';
                document.getElementById('createModal').classList.add('hidden');
                fetchGroups();
            } catch (e) {
                alert('فشل الإنشاء');
            }
        });

        // جلب وتحديث قوائم المجموعات
        async function fetchGroups() {
            const myContainer = document.getElementById('myGroupsList');
            const allContainer = document.getElementById('allGroupsList');
            myContainer.innerHTML = 'جاري التحميل...';
            allContainer.innerHTML = 'جاري التحميل...';

            try {
                const snapshot = await getDocs(collection(db, "groups"));
                myContainer.innerHTML = '';
                allContainer.innerHTML = '';
                let hasMine = false;
                let hasOthers = false;

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const members = data.members || [];
                    const requests = data.requests || [];

                    if (members.includes(user.uid)) {
                        hasMine = true;
                        myContainer.innerHTML += `
                            <div class="list-item">
                                <span>📁 ${data.name}</span>
                                <button class="btn-sec" onclick="openGroup('${id}')">فتح</button>
                            </div>`;
                    } else {
                        hasOthers = true;
                        const requested = requests.some(r => r.uid === user.uid);
                        allContainer.innerHTML += `
                            <div class="list-item">
                                <span>📁 ${data.name}</span>
                                ${requested ? '<span style="font-size:12px; color:gray;">بانتظار الموافقة</span>' : `<button class="btn-sec" onclick="sendJoinRequest('${id}')">طلب انضمام</button>`}
                            </div>`;
                    }
                });

                if (!hasMine) myContainer.innerHTML = '<p style="font-size:13px; color:gray;">ليس لديك مجموعات.</p>';
                if (!hasOthers) allContainer.innerHTML = '<p style="font-size:13px; color:gray;">لا توجد مجموعات أخرى.</p>';
            } catch (e) {
                myContainer.innerHTML = 'خطأ في التحميل';
                allContainer.innerHTML = 'خطأ في التحميل';
            }
        }

        window.sendJoinRequest = async function(id) {
            try {
                const ref = doc(db, "groups", id);
                const snap = await getDoc(ref);
                const data = snap.data();
                let requests = data.requests || [];
                if (!requests.some(r => r.uid === user.uid)) {
                    requests.push({ uid: user.uid, email: user.email });
                    await updateDoc(ref, { requests });
                    alert('تم إرسال الطلب بنجاح');
                    fetchGroups();
                }
            } catch (e) {
                alert('فشل إرسال الطلب');
            }
        }

        window.openGroup = async function(id) {
            currentGroupId = id;
            try {
                const snap = await getDoc(doc(db, "groups", id));
                if (snap.exists()) {
                    currentGroupData = snap.data();
                    document.getElementById('appBox').classList.add('hidden');
                    document.getElementById('groupViewBox').classList.remove('hidden');
                    document.getElementById('groupTitle').innerText = currentGroupData.name;
                    document.getElementById('groupNotes').value = currentGroupData.notes || '';

                    // عرض لوحة المدير إذا كان هو صاحب المجموعة
                    if (currentGroupData.owner === user.uid) {
                        document.getElementById('adminPanel').classList.remove('hidden');
                        renderRequests();
                    } else {
                        document.getElementById('adminPanel').classList.add('hidden');
                    }
                    renderTasks();
                }
            } catch (e) {
                alert('خطأ في فتح المجموعة');
            }
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('groupViewBox').classList.add('hidden');
            document.getElementById('appBox').classList.remove('hidden');
            fetchGroups();
        });

        function renderRequests() {
            const list = document.getElementById('requestsList');
            const reqs = currentGroupData.requests || [];
            if (reqs.length === 0) {
                list.innerHTML = '<span style="font-size:12px; color:gray;">لا توجد طلبات معلقة</span>';
                return;
            }
            list.innerHTML = '';
            reqs.forEach((req, index) => {
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px; font-size:13px;">
                        <span>${req.email}</span>
                        <div>
                            <button class="btn-sec" onclick="handleReq(${index}, true)">موافقة</button>
                            <button class="btn-del" onclick="handleReq(${index}, false)">رفض</button>
                        </div>
                    </div>`;
            });
        }

        window.handleReq = async function(index, approved) {
            let reqs = currentGroupData.requests || [];
            let members = currentGroupData.members || [];
            const target = reqs.splice(index, 1)[0];
            if (approved) members.push(target.uid);

            try {
                await updateDoc(doc(db, "groups", currentGroupId), { requests: reqs, members: members });
                openGroup(currentGroupId);
            } catch (e) {
                alert('حدث خطأ');
            }
        }

        // حفظ الملاحظات تلقائياً عند الكتابة
        document.getElementById('groupNotes').addEventListener('input', async () => {
            if (!currentGroupId) return;
            const notes = document.getElementById('groupNotes').value;
            try {
                await updateDoc(doc(db, "groups", currentGroupId), { notes });
            } catch (e) {}
        });

        // إضافة المهام
        document.getElementById('addTaskBtn').addEventListener('click', async () => {
            const title = document.getElementById('taskTitle').value.trim();
            const assignee = document.getElementById('taskAssignee').value.trim();
            if (!title) return alert('أدخل عنوان المهمة');

            if (!currentGroupData.tasks) currentGroupData.tasks = [];
            currentGroupData.tasks.push({ title, assignee: assignee || 'غير محدد' });

            try {
                await updateDoc(doc(db, "groups", currentGroupId), { tasks: currentGroupData.tasks });
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskAssignee').value = '';
                renderTasks();
            } catch (e) {
                alert('فشل إضافة المهمة');
            }
        });

        function renderTasks() {
            const list = document.getElementById('tasksList');
            const tasks = currentGroupData.tasks || [];
            if (tasks.length === 0) {
                list.innerHTML = '<p style="font-size:13px; color:gray;">لا توجد مهام حالياً</p>';
                return;
            }
            list.innerHTML = '';
            tasks.forEach((t, i) => {
                list.innerHTML += `
                    <div class="list-item">
                        <span><strong>${t.title}</strong> (المسؤول: ${t.assignee})</span>
                        <button class="btn-del" onclick="deleteTask(${i})">حذف</button>
                    </div>`;
            });
        }

        window.deleteTask = async function(i) {
            currentGroupData.tasks.splice(i, 1);
            try {
                await updateDoc(doc(db, "groups", currentGroupId), { tasks: currentGroupData.tasks });
                renderTasks();
            } catch (e) {
                alert('فشل الحذف');
            }
        }

        // تبديل المظهر
        document.getElementById('themeBtn').addEventListener('click', () => {
            document.body.classList.toggle('dark');
        });
    </script>
</body>
</html>
